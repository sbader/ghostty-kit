name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Zig
        # Keep in sync with minimum_zig_version in the pinned Ghostty's build.zig.zon.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: ./Script/test.sh
